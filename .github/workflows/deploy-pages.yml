# ============================================================================
#  Lelwak Stars CBO — build & deploy to GitHub Pages
#
#  Runs on every push to main. Produces a fully static export of the Next.js
#  app and publishes it to https://rrr810.github.io/lelwak-stars/
#
#  One-time repo setting (already done, or: Settings -> Pages ->
#  Build and deployment -> Source -> "GitHub Actions").
#
#  The Supabase keys below are the PUBLIC anon/publishable key and project
#  URL. They are safe to commit by design — they ship to every visitor's
#  browser anyway, and Row Level Security is what protects the data.
#  The service-role key is NOT here and must never be added to this file.
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ncarkchmduwihzoadyiv.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_uwlqjXrv3MgwyyWWp0DI3A_osiZc3DQ
      NEXT_PUBLIC_BASE_PATH: /lelwak-stars
      NEXT_PUBLIC_SITE_URL: https://rrr810.github.io/lelwak-stars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Sanity-check the export
        run: |
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          test -f out/partner-with-us.html || { echo "form page missing"; exit 1; }
          grep -q "lelwak-stars/_next" out/index.html || { echo "basePath not applied"; exit 1; }
          echo "export ok: $(du -sh out | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
